<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Color Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1 id="title">What's your color Base?</h1>
        
        <div class="base-options" id="base-selector">
            <div class="option" onclick="initColor(340, 'Petal Pink', 'Bloom', 'Wilt')">
                <div class="dot" style="background:#FFD1DC"></div>
                <span>Petal Pink</span>
            </div>
            <div class="option" onclick="initColor(85, 'Matcha Green', 'Sprout', 'Harvest')">
                <div class="dot" style="background:#E2F0CB"></div>
                <span>Matcha Green</span>
            </div>
            <div class="option" onclick="initColor(260, 'Lavender', 'Dream', 'Twilight')">
                <div class="dot" style="background:#D6D6F5"></div>
                <span>Lavender</span>
            </div>
            <div class="option" onclick="initColor(50, 'Sun Yellow', 'Glow', 'Gold')">
                <div class="dot" style="background:#FFF9C4"></div>
                <span>Sun Yellow</span>
            </div>
            <div class="option" onclick="initColor(200, 'Cloud Blue', 'Shiner', 'Stormier')">
                <div class="dot" style="background:#B3E5FC"></div>
                <span>Cloud Blue</span>
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <h2 id="hex-display">#FFFFFF</h2>
            <div class="button-group">
                <button id="light-btn" onclick="adjustLight(7)">Lighter</button>
                <button id="dark-btn" onclick="adjustLight(-7)">Darker</button>
            </div>
            <button class="save-btn" onclick="saveToPalette()">Save to Palette</button>
            <p class="reset" onclick="goBack()">← Pick a new base</p>
        </div>

        <div class="palette-section">
            <hr>
            <h3>My Palette</h3>
            <div id="palette-display" class="palette-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
